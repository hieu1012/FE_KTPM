<div>

  <h1 class="px-40 py-5 text-2xl font-bold ">Customer Login</h1>
  <div class=" flex items-center justify-center bg-gray-100 p-4">

    <div class="w-full max-w-5xl flex shadow-lg rounded-lg overflow-hidden">
      <!-- Registered Customers Section -->
      <div class="w-1/2 bg-white p-6">
        <h2 class="text-2xl font-bold mb-2 text-gray-800">Login</h2>
        <p class="text-gray-600 mb-2">If you have an account, sign in with your email address.</p>

        <div class="mb-2">
          <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
          <input type="email" id="email" [(ngModel)]="email" placeholder="Your email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-4">
          <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
          <input type="password" id="password" [(ngModel)]="password" placeholder="Your password"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="flex items-center justify-between mb-4">
          <button (click)="onSignIn()"
            class="bg-blue-600 text-white px-8 py-2 rounded-3xl hover:bg-blue-700 transition duration-300">
            Sign In
          </button>
          <a href="#" class="text-blue-600 hover:underline text-sm">Forgot Your Password?</a>
        </div>
      </div>

      <!-- New Customer Section -->
      <div class="w-1/2 bg-gray-100 p-8 flex flex-col justify-center items-center text-center">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">New Customer?</h2>
        <p class="text-gray-600 mb-6">Creating an account has many benefits:</p>

        <ul class="text-gray-700 mb-6 list-disc list-inside text-left">
          <li>Check out faster</li>
          <li>Keep more than one address</li>
          <li>Track orders and more</li>
        </ul>
        <button [routerLink]="['/register']"
          class="bg-blue-600 text-white px-6 py-3 rounded-3xl hover:bg-blue-700 transition duration-300">
          Create An Account
        </button>
      </div>
    </div>
  </div>


</div>
