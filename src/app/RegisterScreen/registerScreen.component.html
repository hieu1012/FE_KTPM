<div>
  <h1 class="px-40 py-5 text-2xl font-bold">Customer Registration</h1>
  <div class="flex items-center justify-center bg-gray-100 p-4">
    <div class="w-full max-w-5xl flex shadow-lg rounded-lg overflow-hidden">
      <!-- Registration Section -->
      <div class="w-1/2 bg-white p-6">
        <h2 class="text-2xl font-bold mb-2 text-gray-800">Create Account</h2>
        <p class="text-gray-600 mb-2">Please fill in the details to create an account.</p>

        <div class="mb-2">
          <label for="fullName" class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
          <input type="text" id="fullName" placeholder="Your full name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-2">
          <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
          <input type="email" id="email" placeholder="Your email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-2">
          <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
          <input type="password" id="password" placeholder="Your password"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="text-center">
          <button class="bg-blue-600 text-white px-8 py-2 rounded-3xl hover:bg-blue-700 transition duration-300 ">
            Register
          </button>
        </div>


      </div>

      <!-- Benefits Section -->
      <div class="w-1/2 bg-gray-100 p-8 flex flex-col justify-center items-center text-center">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Why Register?</h2>
        <p class="text-gray-600 mb-6">Creating an account provides these benefits:</p>
        <ul class="text-gray-700 mb-6 list-disc list-inside text-left">
          <li>Faster checkout</li>
          <li>Save multiple addresses</li>
          <li>Track your orders</li>
        </ul>
        <p class="text-gray-600">Already have an account?</p>
        <a [routerLink]="['/', ROUTING.LOGIN_SCREEN]"
          class="text-gray-100  text-1xl bg-blue-600  px-8 py-2 rounded-3xl mt-4">Sign In</a>
      </div>
    </div>
  </div>
</div>
